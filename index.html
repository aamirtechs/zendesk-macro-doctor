<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zendesk Macro Doctor - AamirTechs</title>
<style>
:root{--navy:#0b1f3a;--gold:#d4a72c;--bg:#f6f8fb;--ink:#1c2733;--muted:#5b6b7c;--line:#d9e1ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 20px;border-bottom:4px solid var(--gold)}
header .wrap{max-width:880px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.6rem}
header p{margin:0;color:#c8d4e4}
main{max-width:880px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(11,31,58,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}
.card>label:first-child{margin-top:0}
textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
textarea.small{min-height:90px}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.grid label{margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.gold{background:var(--gold);color:#0b1f3a;font-weight:600}
pre{background:#0b1f3a;color:#eef3f9;border-radius:8px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;min-height:60px;font-size:.85rem}
footer{max-width:880px;margin:0 auto 32px;padding:0 20px;color:var(--muted);font-size:.9rem}
footer a{color:var(--navy)}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap"><h1>Zendesk Macro Doctor</h1><p>Audit a Zendesk macros CSV export for unused, duplicated, and stale macros.</p></div></header>
<main><div class="card">
<label for="file">Input CSV file</label>
<input type="file" id="file" accept=".csv,text/csv">
<label for="input">Or paste the macros CSV</label>
<textarea id="input" spellcheck="false" placeholder="Paste a Zendesk macros CSV export here, or load the sample."></textarea>
<label for="prices-file">Current prices CSV file <span class="hint">(--prices-file, optional)</span></label>
<input type="file" id="prices-file" accept=".csv,text/csv">
<label for="prices">Or paste the prices CSV <span class="hint">(product,price; leave blank to skip stale price checks)</span></label>
<textarea id="prices" class="small" spellcheck="false" placeholder="product,price"></textarea>
<label for="deleted-file">Deleted groups and agents file <span class="hint">(--deleted-file, optional)</span></label>
<input type="file" id="deleted-file" accept=".txt,text/plain">
<label for="deleted">Or paste deleted names <span class="hint">(one per line; leave blank to skip)</span></label>
<textarea id="deleted" class="small" spellcheck="false" placeholder="One deleted group or agent name per line"></textarea>
<label for="dead-file">Dead domains file <span class="hint">(--dead-domains-file, optional)</span></label>
<input type="file" id="dead-file" accept=".txt,text/plain">
<label for="dead">Or paste dead domains <span class="hint">(one per line; leave blank to skip)</span></label>
<textarea id="dead" class="small" spellcheck="false" placeholder="One dead domain per line"></textarea>
<label>Options</label>
<div class="grid">
<div><label for="opt-unused">Unused days <span class="hint">(--unused-days)</span></label><input type="number" id="opt-unused" step="1" value="90"></div>
<div><label for="opt-minuses">Min uses <span class="hint">(--min-uses)</span></label><input type="number" id="opt-minuses" step="1" value="5"></div>
<div><label for="opt-asof">As of date <span class="hint">(--as-of, blank means now)</span></label><input type="text" id="opt-asof" placeholder="2026-11-18"></div>
</div>
<div class="row"><button class="gold" id="run" type="button">Run check</button><button class="alt" id="sample" type="button">Load sample</button><button class="alt" id="download" type="button">Download report</button></div>
<label for="out">Report</label>
<pre id="out">Your report will appear here.</pre>
</div></main>
<footer>
<p>Built by AamirTechs. <a href="https://aamirtechs.github.io/">All tools</a> | <a href="https://github.com/aamirtechs/zendesk-macro-doctor">Source</a></p>
<p>Privacy: this tool runs 100% in your browser, nothing is uploaded.</p>
</footer>
<script id="core">

    function () { return tryPattern(candidate, "dmy", true); },
    function () { return tryPattern(candidate, "mdy", true); },
    function () { return tryPattern(candidate, "dmy", false); },
    function () { return tryPattern(candidate, "mdy", false); }

function nowTs() {

function parseUseCount(text) {

function normalizeText(text) {

  if (lowered.indexOf("assign to group:") === 0 || lowered.indexOf("assign group:") === 0) return "assign-group";

  var pCol = findColumn(header, ["product", "name", "plan"]);
  if (pCol === null) throw new Error("prices file has no product column (header is: " + header.join(", ") + ")");

  if (priceCol === null) throw new Error("prices file has no price column (header is: " + header.join(", ") + ")");

    var row = rows[i], lineNumber = i + 1;
    if (rowIsBlank(row)) continue;

      findings.push(F("row " + lineNumber, "malformed-row", "error",

      continue;

    var product = cells[pCol];

};
